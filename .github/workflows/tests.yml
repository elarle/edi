name: tests
run-name: ${{ github.actor }} is checking for project tests errors
on: [push]
jobs:
  install-gcc:
    run-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install g++
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Compile the project
        run: bash ./run.sh

      - name: Run the project tests.
        run: bash ./test.sh .temp/main
        
