name: tests
run-name: ${{ github.actor }} is checking for project tests errors
on: [push]
jobs:
  install-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install g++
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Compile the project
        run: bash ./run.sh

      - name: Run the project tests.
        run: bash ./test.sh .temp/main

      - name: Upload executable
        uses: actions/upload-artifact@v6
        with:
          name: main-linux
          path: .temp/main

      - name: Compile the proejct for windows. 
        uses: https://codeberg.org/mlugg/setup-zig@v2
        run: bash ./run.sh -w

      - name: Upload windows executable
        uses: actions/upload-artifact@v6
        with:
          name: main-windows
          path: .temp/main.exe
        
